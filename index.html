<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>So'z Topish O'yini — Uzbek Word Search</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background -->
<div id="bg-layer" class="dawn"></div>
<canvas id="particles-canvas"></canvas>

<!-- Ornament corners (SVG pattern) -->
<div class="ornament-corner oc-tl"><svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M5 5 Q60 5 60 60 Q60 5 115 5" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <path d="M5 5 Q5 60 60 60 Q5 60 5 115" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <circle cx="60" cy="60" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="5" cy="5" r="4" fill="#D4AF37" opacity="0.6"/>
  <path d="M20 5 Q5 5 5 20" stroke="#D4AF37" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <path d="M5 20 Q5 5 20 5" stroke="#D4AF37" stroke-width="1.5" fill="none"/>
</svg></div>
<div class="ornament-corner oc-tr"><svg viewBox="0 0 120 120" fill="none"><path d="M5 5 Q60 5 60 60 Q60 5 115 5" stroke="#D4AF37" stroke-width="2" fill="none"/><path d="M5 5 Q5 60 60 60 Q5 60 5 115" stroke="#D4AF37" stroke-width="2" fill="none"/><circle cx="60" cy="60" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/><circle cx="5" cy="5" r="4" fill="#D4AF37" opacity="0.6"/></svg></div>
<div class="ornament-corner oc-bl"><svg viewBox="0 0 120 120" fill="none"><path d="M5 5 Q60 5 60 60 Q60 5 115 5" stroke="#D4AF37" stroke-width="2" fill="none"/><path d="M5 5 Q5 60 60 60 Q5 60 5 115" stroke="#D4AF37" stroke-width="2" fill="none"/><circle cx="60" cy="60" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/><circle cx="5" cy="5" r="4" fill="#D4AF37" opacity="0.6"/></svg></div>
<div class="ornament-corner oc-br"><svg viewBox="0 0 120 120" fill="none"><path d="M5 5 Q60 5 60 60 Q60 5 115 5" stroke="#D4AF37" stroke-width="2" fill="none"/><path d="M5 5 Q5 60 60 60 Q5 60 5 115" stroke="#D4AF37" stroke-width="2" fill="none"/><circle cx="60" cy="60" r="8" fill="none" stroke="#D4AF37" stroke-width="1.5"/><circle cx="5" cy="5" r="4" fill="#D4AF37" opacity="0.6"/></svg></div>

<!-- Floating shapes -->
<div class="floating-shape" style="top:15%;left:5%;animation-delay:0s;">✦</div>
<div class="floating-shape" style="top:60%;left:88%;animation-delay:2s;">◆</div>
<div class="floating-shape" style="top:35%;left:92%;animation-delay:4s;font-size:50px;">❋</div>
<div class="floating-shape" style="top:75%;left:3%;animation-delay:6s;font-size:60px;">✦</div>
<div class="floating-shape" style="top:5%;left:75%;animation-delay:3s;font-size:40px;">◈</div>

<!-- Toast -->
<div id="toast"></div>

<!-- ===== START SCREEN ===== -->
<div id="start-screen" class="screen">
  <div class="logo-wrap">
    <div class="logo-icon">🏛️</div>
    <div class="logo-title">SO'Z TOPISH</div>
    <div class="logo-sub">O'yini • Uzbekiston</div>
  </div>
  <div class="highscore-badge">
    <div class="label">Eng yuqori ball</div>
    <div class="value" id="hs-display">0</div>
  </div>
  <button class="btn-play" id="btn-start">O'YNASH</button>
  <button class="btn-secondary" id="btn-settings-start">⚙️ Sozlamalar</button>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="game-screen" class="screen hidden">
  <div class="game-header">
    <div class="stat-chip">
      <span class="icon">⭐</span>
      <div><div class="val" id="score-display">0</div><div class="lbl">BALL</div></div>
    </div>
    <div class="level-badge" id="level-display">DARAJA 1</div>
    <div class="stat-chip">
      <span class="icon">🪙</span>
      <div><div class="val" id="coins-display">0</div><div class="lbl">TANGA</div></div>
    </div>
    <div class="stat-chip">
      <span class="icon">⏱️</span>
      <div><div class="val" id="timer-display">00:00</div><div class="lbl">VAQT</div></div>
    </div>
  </div>

  <div class="grid-wrapper">
    <div class="grid-container">
      <div id="word-grid"></div>
    </div>
  </div>

  <div class="words-panel">
    <div class="words-panel-inner">
      <div class="words-panel-title" id="category-display">So'zlar</div>
      <div class="words-list" id="words-list"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-menu" id="btn-menu">☰</button>
    <div class="category-label" id="combo-label"></div>
    <button class="btn-hint" id="btn-hint">💡 Ko'mak <span class="hint-count" id="hint-count">3</span></button>
  </div>
</div>

<!-- ===== LEVEL COMPLETE MODAL ===== -->
<div id="level-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">Barakalla! 🎉</div>
    <div class="modal-sub" id="modal-sub-text">Daraja muvaffaqiyatli yakunlandi</div>
    <div class="stars-row" id="stars-row">
      <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
    </div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <div class="achievements-row" id="achievements-row"></div>
    <button class="btn-play" id="btn-next-level" style="width:100%;font-size:16px;padding:14px;">Keyingi Daraja ➤</button>
  </div>
</div>

<!-- ===== SETTINGS PANEL ===== -->
<div id="settings-panel" class="hidden">
  <div class="settings-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span style="font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);font-weight:700;">Sozlamalar</span>
      <button id="btn-close-settings" class="btn-menu">✕</button>
    </div>
    <div class="settings-row">
      <span>🎵 Musiqa</span>
      <div class="toggle on" id="toggle-music"></div>
    </div>
    <div class="settings-row">
      <span>🔊 Ovozlar</span>
      <div class="toggle on" id="toggle-sfx"></div>
    </div>
    <div class="settings-row">
      <span>✨ Animatsiyalar</span>
      <div class="toggle on" id="toggle-anim"></div>
    </div>
    <div class="settings-row" style="border-top:1px solid rgba(255,255,255,0.1);margin-top:8px;">
      <span>🗑️ O'yinni qayta boshlash</span>
      <button class="btn-secondary" id="btn-reset" style="padding:8px 16px;font-size:12px;">Tozalash</button>
    </div>
    <div class="settings-row">
      <span style="color:rgba(255,255,255,0.4);font-size:12px;">So'z Topish O'yini v1.0 — Uzbekiston</span>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Word Search - O'zbek tilidagi so'z topish o'yini">
    <title>Word Search | O'zbekiston bo'ylab sayohat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Slider -->
    <div class="bg-slider">
        <div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1587280501635-68a0e82cd5ff?w=1920&q=80')"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1587280501635-68a0e82cd5ff?w=1920&q=80')"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1545569341-9eb8b30979d9?w=1920&q=80')"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1534751516642-3b6a4f4f8ab6?w=1920&q=80')"></div>
        <div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1534751516642-3b6a4f4f8ab6?w=1920&q=80')"></div>
        <div class="overlay"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">
                <span class="neon-text">✨ WORD SEARCH</span>
                <span class="subtitle">O'zbekiston bo'ylab sayohat</span>
            </h1>
            
            <!-- Score & Progress -->
            <div class="stats">
                <div class="score-card">
                    <span class="score-label">🎯 TOPILGAN</span>
                    <span class="score-value" id="scoreValue">0</span>
                    <span class="score-total" id="scoreTotal">/0</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="game-area">
            <!-- Words List -->
            <div class="words-panel">
                <div class="panel-header">
                    <h3>📝 TOPILADIGAN SO'ZLAR</h3>
                    <button class="reset-btn" id="resetBtn">
                        <span>🔄</span> Yangilash
                    </button>
                </div>
                <div class="words-list" id="wordsList"></div>
            </div>

            <!-- Game Grid -->
            <div class="grid-container">
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <!-- Messages -->
        <div class="message" id="message"></div>
        
        <!-- Footer -->
        <div class="footer">
            <p>Sichqoncha bilan belgilang | Topilgan so'zlar chiziladi</p>
        </div>
    </div>

    <script src="words.js"></script>
    <script src="app.js"></script>
</body>
</html>
